[project]
name = "reuse-router"
version = "0.1.0"
description = "Demo: Jev (TypeSafe AI) as an auditable decision layer in front of spec-driven development."
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
