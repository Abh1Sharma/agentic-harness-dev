<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeAI Marketplace</title>
<style>
:root { color-scheme: light; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --critical: #d03b3b; --focus: #2a78d6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --axis: #383835; --border: rgba(255,255,255,0.10); --focus: #3987e5; }
}
:root[data-theme="dark"] { color-scheme: dark; --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --axis: #383835; --border: rgba(255,255,255,0.10); --focus: #3987e5; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { color: var(--ink-2); margin: 0 0 16px; font-size: 14px; }
label { display: block; font-size: 13px; color: var(--ink-2); }
input { display: block; width: 100%; margin: 4px 0 14px; padding: 9px 10px; border: 1px solid var(--axis); border-radius: 8px; background: var(--page); color: var(--ink); font: inherit; }
button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--ink); color: var(--page); font: inherit; font-weight: 600; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.error { color: var(--ink); border-left: 4px solid var(--critical); padding: 6px 10px; margin: 12px 0 0; font-size: 13px; }
.request { margin: 14px 0 0; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<form id="login">
  <h1>SafeAI Marketplace</h1>
  <p>Proof of concept. Enter the demo password.</p>
  <label>Password <input id="password" type="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Sign in</button>
  <p id="error" class="error" hidden></p>
  <p class="request">No password? Message Abhi on Slack for access.</p>
</form>
<script>
"use strict";
const params = new URLSearchParams(location.search);
// Only return to a path on this site, never an outside URL.
const next = params.get("next") || "/";
const target = next.startsWith("/") && !next.startsWith("//") ? next : "/";
// One-click link: /login?password=... signs in, and the password leaves the address bar first.
const shared = params.get("password");
if (shared) {
  params.delete("password");
  history.replaceState(null, "", location.pathname + (params.size ? `?${params}` : ""));
}
document.getElementById("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  const error = document.getElementById("error");
  const response = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: document.getElementById("password").value }),
  });
  if (response.ok) { location.href = target; return; }
  error.textContent = (await response.json().catch(() => ({}))).detail || "Sign-in failed.";
  error.hidden = false;
});
if (shared) {
  document.getElementById("password").value = shared;
  document.getElementById("login").requestSubmit();
}
</script>
</body>
</html>
